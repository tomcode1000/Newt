[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newt-docs"
version = "0.1.0"
description = "Every doc, tried by a newcomer: follows your docs in a fresh sandbox and fixes them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Tolulope Filade" }]
dependencies = [
    "docker>=7.0",
    "httpx>=0.27",
    "markdownify>=0.13",
    "neatlogs>=1.4",
    "openrouter>=1.3.43",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
newt = "newt.cli:main"

[tool.setuptools.packages.find]
include = ["newt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: needs a running Docker daemon",
    "live: calls the real model through OpenRouter (needs OPENROUTER_API_KEY)",
]
